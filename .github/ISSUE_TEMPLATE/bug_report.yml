name: Bug report
description: Report a defect in the skill contract, scripts, examples, exports, or packaging workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and where did you notice it?
      placeholder: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Share the exact steps, command, or file path needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation or evidence
      description: Paste relevant output, validation errors, or screenshots if helpful.
  - type: dropdown
    id: area
    attributes:
      label: Impacted area
      options:
        - Skill instructions
        - Validation or parsing
        - Refinement workflow
        - Export behavior
        - Packaging or CI
        - Examples or docs
    validations:
      required: true
