name: backlog-story-generator
display_name: Backlog Story Generator
version: 5.3.0
author: jovd83
license: MIT
description: Generate structured epics and backlog-ready user stories from requirements, discovery notes, existing story packs, or an observed codebase. Includes validation, evidence guardrails, and CSV export for Jira, Azure DevOps, GitHub Issues, and Tulip.
short_description: Turn requirements into validated epic and user story packs.
default_prompt: Generate a validated backlog story pack from the provided source material, preserve numbering continuity when extending an existing pack, surface assumptions explicitly, and export only if requested.
entrypoint: SKILL.md
repository:
  name: backlog-story-generator
  visibility: public
compatibility:
  node: ">=20"
commands:
  setup: npm run setup
  verify: npm run verify
  validate_examples: npm run validate:examples
  lint_quality_examples: npm run lint:quality:examples
  improve_examples: npm run improve:examples
  package: npm run package
  report_existing_pack: npm run report:existing-pack
evaluation:
  prompts: evals/evals.json
docs:
  readme: README.md
  changelog: CHANGELOG.md
  customization: docs/adapt-for-your-org.md
  quality_workflow: docs/story-pack-quality-workflow.md
  memory_model: docs/memory-model.md
