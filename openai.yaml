name: backlog-story-generator
version: 3.4.0
author: jovd83
license: MIT
description: Generate structured product epics, backlog-ready user stories, and ticket-import story packs from requirements, discovery notes, SOPs, workshop notes, existing backlog files, or a live codebase.
entrypoint: SKILL.md
repository:
  name: backlog-story-generator
  visibility: public-ready
artifacts:
  package_dir: dist/backlog-story-generator.skill
  manifest_example: skill-manifest.example.json
compatibility:
  node: ">=18"
commands:
  verify: npm run verify
  package: npm run package
  validate_examples: npm run validate:examples
  export_examples_jira: npm run export:examples:jira
  report_existing_pack: npm run report:existing-pack
  inspect_fixture_codebase: npm run inspect:fixture-codebase
evaluation:
  prompts: evals/evals.json
  latest_report: evals/latest-eval-report.md
docs:
  readme: README.md
  changelog: CHANGELOG.md
  adaptation_guide: docs/adapt-for-your-org.md
